<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      min-width: 200px;
    }
    .seek-item {
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 6px;
      background-color: #f1f1f1;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .seek-item:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h3>Last Seeks</h3>
  <div id="history"></div>
  <script src="popup.js"></script>
</body>
</html>
